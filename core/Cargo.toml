[package]
name = "prodrome-core"
description = "Prodrome: content-addressed event DAG, causal folds, and FPL — the one evaluator (see ../SPEC.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "prodrome"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `str.isprintable`'s Unicode categories, which the string printer needs to
# reproduce CPython's `repr` byte for byte (SPEC section 2). Data tables only.
unicode-general-category = "1"

[dev-dependencies]
proptest = "1"
