[package]
name = "prodrome-core"
description = "Prodrome: content-addressed event DAG, causal folds, and FPL — the one evaluator (see ../SPEC.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "prodrome"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `str.isprintable`'s Unicode categories, which the string printer needs to
# reproduce CPython's `repr` byte for byte (SPEC section 2). Data tables only.
unicode-general-category = "1"

# THE STORE'S LOCK, ON UNIX ONLY. `EventStore::append` takes an exclusive
# `flock` on `root/.lock` — the same file and the same operation the Python
# writer takes (`suzatary/prodrome/store.py::_flock`), because both append to
# one `events/` until stage 4 of `docs/ARCHITECTURE.md`. Target-gated because
# `prodrome-wasm` compiles this crate for `wasm32-unknown-unknown`, which has no
# filesystem to lock and whose `errno` will not build.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
proptest = "1"
