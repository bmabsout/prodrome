[package]
name = "prodrome-wasm"
description = "Prodrome in the browser: the one evaluator, compiled to WebAssembly (see ../SPEC.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "prodrome_wasm"
path = "src/lib.rs"
# A cdylib and nothing else: this crate is a BOUNDARY, not a library anything
# links against. `rlib` beside it would let the workspace's own tests reach in
# and pin the wire shapes from Rust, which is the wrong place for them — the
# shapes exist for a JavaScript reader and web/test/wasm.test.ts is where a
# drift must fail.
crate-type = ["cdylib"]

[dependencies]
prodrome-core = { path = "../core" }
# Pinned to the EXACT patch the flake's `wasm-bindgen-cli_0_2_127` is: the
# generator and the runtime negotiate over a schema version baked into both,
# and a mismatch is a link error at bindgen time rather than a bug later.
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
