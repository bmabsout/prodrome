[package]
name = "prodrome-wasm"
description = "prodrome-core compiled to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["wasm", "webassembly", "event-sourcing", "database", "temporal"]
categories = ["wasm", "database-implementations"]
# NOT for crates.io: this crate is a BOUNDARY, not a library — its product is
# the `.wasm` and the JS glue `nix build .#prodrome-wasm` emits, and a source
# package of it on a registry would be a thing nobody can `cargo add`. It goes
# public when there is a published artefact for it to be the source of.
publish = false

[lib]
name = "prodrome_wasm"
path = "src/lib.rs"
# A cdylib, and an rlib so that a host's own crate can build ITS module from
# this one: it depends on this crate with `default-features = false` and
# instantiates `prodrome_wasm::schema!` for each of its schemas (see the
# crate's header). The wire shapes are still pinned where a JavaScript reader
# meets them: the snapshot drives every export, and the viewer the built
# module.
crate-type = ["cdylib", "rlib"]

[features]
# The REFERENCE module: the todo schema at the reference payload, every export
# it has always had. A host's module turns it off and has only its own.
default = ["reference"]
reference = []

[dependencies]
prodrome-core = { path = "../core" }
# Pinned to the EXACT patch the flake's `wasm-bindgen-cli_0_2_127` is: the
# generator and the runtime negotiate over a schema version baked into both,
# and a mismatch is a link error at bindgen time rather than a bug later.
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
