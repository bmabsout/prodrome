[package]
name = "prodrome-wasm"
description = "The Prodrome in the browser: prodrome-core compiled to WebAssembly, one evaluator for every host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../README.md"
keywords = ["wasm", "webassembly", "event-sourcing", "database", "temporal"]
categories = ["wasm", "database-implementations"]
# NOT for crates.io: this crate is a BOUNDARY, not a library — its product is
# the `.wasm` and the JS glue `nix build .#prodrome-wasm` emits, and a source
# package of it on a registry would be a thing nobody can `cargo add`. It goes
# public when there is a published artefact for it to be the source of.
publish = false

[lib]
name = "prodrome_wasm"
path = "src/lib.rs"
# A cdylib and nothing else: this crate is a BOUNDARY, not a library anything
# links against. `rlib` beside it would let the workspace's own tests reach in
# and pin the wire shapes from Rust, which is the wrong place for them — the
# shapes exist for a JavaScript reader and web/test/wasm.test.ts is where a
# drift must fail.
crate-type = ["cdylib"]

[dependencies]
prodrome-core = { path = "../core" }
# Pinned to the EXACT patch the flake's `wasm-bindgen-cli_0_2_127` is: the
# generator and the runtime negotiate over a schema version baked into both,
# and a mismatch is a link error at bindgen time rather than a bug later.
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
