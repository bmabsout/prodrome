[workspace]
resolver = "2"
members = ["cli", "core", "wasm"]

[workspace.package]
version = "0.5.0"
edition = "2021"
# The Rust default, so that using this crate is a decision about the code and
# not about a licence: MIT for the permissive reading, Apache-2.0 for the
# patent grant, at the user's option. LICENSE-MIT and LICENSE-APACHE are the
# texts; README.md carries the contribution clause.
license = "MIT OR Apache-2.0"
repository = "https://github.com/bmabsout/prodrome"
# The floor the LOCKED tree needs, which is proptest's (a dev-dependency) at
# 1.85. The library's own dependencies want considerably less; this is the
# version `cargo test` is known to pass on rather than a guess about the
# oldest one that could compile the crate.
rust-version = "1.85"

# The browser's build, and nothing else's.
#
# A profile of its own rather than settings on `[profile.release]`: the wasm is
# the one artefact whose SIZE is a user-visible cost — it is fetched over the
# tailnet before the chain page can say anything — and tuning the whole
# workspace's release build for a constraint only one target has would be
# tuning it for the wrong reason. `opt-level = "s"` and fat LTO cost the native
# core nothing here because the native core never uses this profile.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# THE CORE, AS ONE ENTRY. `prodrome-cli` depends on it by path (what this
# workspace builds against) and by version (what a published `prodrome-cli`
# would resolve to), and the two live here beside `workspace.package.version`
# so that a release bumps one file.
[workspace.dependencies]
prodrome-core = { path = "core", version = "0.5.0" }
