[package]
name = "prodrome-typst-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
typst = "=0.15.1"
typst-html = "=0.15.1"
typst-ide = { version = "=0.15.1", optional = true }
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# EVERYTHING BUT THE COMPILER IS A FEATURE, each independent of the others.
# The default is the viewer's module, editor and all. A host's views module
# (`nix build .#prodrome-typst-wasm-views`) is `highlight` alone: `Project`,
# `add_font`, `typst_version` and `highlight`; its editor module
# (`.#prodrome-typst-wasm-editor`) adds `ide`.
[features]
default = ["oneshot", "highlight", "ide"]
# `compile_html(source, files_json)`: a world made for one call.
oneshot = []
# `highlight(source)`: the editor's syntax colouring.
highlight = []
# `complete` and `hover`, from typst-ide.
ide = ["dep:typst-ide"]

[workspace]

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
