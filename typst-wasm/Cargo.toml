[package]
name = "prodrome-typst-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
typst = "=0.15.1"
typst-html = "=0.15.1"
typst-syntax = "=0.15.1"
typst-ide = "=0.15.1"
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
