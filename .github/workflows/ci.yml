# One gate, and it is the same command a developer runs: the checks live in
# flake.nix, so CI needs no Rust toolchain of its own and no network during the
# build. Every store path a run builds goes to the public bmabsout.cachix.org
# cache, which this CI, cloud sessions and the box all read, so a run rebuilds
# only what its commit changed. (Magic Nix Cache stopped uploading a minute
# into a run, so pull requests found almost nothing of main's.) A pull request runs
# once, as a pull request; main runs on push.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v17
        with:
          name: bmabsout
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # `cargo test` over the workspace and clippy at -D warnings, both in the
      # sandbox (checks.prodrome-workspace), and every package built as a
      # check: the wasm, and the binary the roadmap steps below link.
      - run: nix flake check --print-build-logs
      # THE ROADMAP IS DATA, ON ITS OWN BRANCH, AND THIS IS THE CHECK THAT THE
      # CODE STILL READS IT. The binary is built from this commit and pointed at
      # the `roadmap-data` branch: `verify` says every object rehashes to its
      # name and rests on a parent that exists, and `list` says the whole store
      # still folds under this code.
      - uses: actions/checkout@v4
        with:
          ref: roadmap-data
          path: roadmap-data
      - run: nix build .#prodrome-cli -o result-cli --print-build-logs
      - run: ./result-cli/bin/prodrome verify --store roadmap-data/roadmap
      - run: ./result-cli/bin/prodrome list --store roadmap-data/roadmap
