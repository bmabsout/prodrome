[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "prodrome"
description = "The Prodrome core (SPEC.md) as a Python extension module"
requires-python = ">=3.13"
classifiers = ["Programming Language :: Rust"]
dynamic = ["version"]

[tool.maturin]
# The crate is a workspace member; its lock file is the workspace's, which is
# what Nix vendors. `bindings` is stated rather than sniffed so a build that
# somehow lost the pyo3 dependency fails loudly instead of guessing.
bindings = "pyo3"
module-name = "prodrome"
strip = true
