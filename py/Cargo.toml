[package]
name = "prodrome-py"
description = "The Python binding to the Prodrome core: conversions only, no semantics (see ../SPEC.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The import name. `prodrome` in Python IS this cdylib; there is no Python
# wrapper module, because a wrapper is a place for a second reading to grow.
name = "prodrome"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
prodrome_core = { package = "prodrome-core", path = "../core" }
# NOT abi3: this extension is built by Nix against the exact interpreter the
# `.#triage` shell carries (3.14 today), so the stable-ABI subset would buy
# portability nothing here consumes and cost the fast paths it forbids.
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = "1"
